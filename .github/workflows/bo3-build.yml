name: BO3 Auto Build

on:
  push:
    branches: [nexus/standalone-converter]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bo3-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    if: github.ref == 'refs/heads/nexus/standalone-converter'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host regression dependencies
        run: sudo apt-get update && sudo apt-get install -y clang liblua5.4-0
      - name: Validate GitHub Actions workflows
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Test release policy and package validation
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Run committed SPRX host regressions
        run: python3 .github/scripts/run_host_checks.py

  porter:
    needs: host
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Tool/Porter/global.json
      - name: Run existing offline converter checks
        shell: cmd
        run: Tool\Porter\tests\run.cmd
      - name: Publish and package the converter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location Tool/Porter
          dotnet publish src/FFPorter.Desktop.T7/FFPorter.Desktop.T7.csproj -p:PublishProfile=FolderProfile -o "$env:GITHUB_WORKSPACE/build/porter"
          if ($LASTEXITCODE -ne 0) { throw 'Converter publish failed.' }
          Pop-Location
          python .github/scripts/build_support.py porter 'build/porter/PS4 .FF Porter.exe' build/artifact-porter
          if ($LASTEXITCODE -ne 0) { throw 'Converter packaging failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bo3-porter-${{ github.sha }}-${{ github.run_attempt }}
          path: build/artifact-porter/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  sprx:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BO3_SPRX_CONFIGURATION: ${{ vars.BO3_SPRX_CONFIGURATION || 'Release' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install the PS4 cross compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18
      - name: Compile and inspect the GoldHEN SPRX
        run: python3 .github/scripts/build_sprx.py --package
      - name: Reject corrupted native module and container variants
        run: python3 .github/scripts/tests/check_native_artifact.py build/openorbis "$BO3_SPRX_CONFIGURATION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bo3-sprx-${{ github.sha }}-${{ github.run_attempt }}
          path: build/artifact-sprx/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save native build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bo3-native-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/openorbis/build.log
            build/openorbis/readoelf.txt
            build/openorbis/target-validation.json
          if-no-files-found: warn
          retention-days: 14

  complete:
    needs: [host, porter, sprx]
    if: always() && github.ref == 'refs/heads/nexus/standalone-converter'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      HOST_RESULT: ${{ needs.host.result }}
      PORTER_RESULT: ${{ needs.porter.result }}
      SPRX_RESULT: ${{ needs.sprx.result }}
    steps:
      - name: Require every component before declaring this commit built
        run: |
          if [ "$HOST_RESULT" != success ] || [ "$PORTER_RESULT" != success ] || [ "$SPRX_RESULT" != success ]; then
            echo '::error::Full build is blocked. Check the host, Windows converter and Linux OpenOrbis SPRX jobs.'
            exit 1
          fi
          echo 'Host checks, offline converter checks and both builds passed. PS4 console validation is pending.' >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [complete]
    if: needs.complete.result == 'success' && github.ref == 'refs/heads/nexus/standalone-converter'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download sprx artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: bo3-sprx-*
          merge-multiple: true
          path: dist
      - name: Publish fork prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la dist/
          SHORT=$(printf '%.7s' "${{ github.sha }}")
          TAG="fork-${SHORT}"
          if [ -f CHANGELOG_FORK.md ]; then
            BODY=$(head -c 8000 CHANGELOG_FORK.md)
          else
            BODY="Fork build at ${{ github.sha }}"
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/BO3-Customs.sprx dist/manifest-sprx.json --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/BO3-Customs.sprx dist/manifest-sprx.json \
              --repo "${{ github.repository }}" \
              --prerelease \
              --target "${{ github.sha }}" \
              --title "Fork build $TAG" \
              --notes "$BODY"
          fi
          echo "Fork release $TAG published." >> "$GITHUB_STEP_SUMMARY"
